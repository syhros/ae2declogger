name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MC_VERSION: 1.20.1
  FORGE_VERSION: 47.3.0
  AE2_VERSION: 15.4.10
  GUIDEME_VERSION: 20.1.7
  GTCEU_VERSION: 7.5.3

jobs:
  build:
    name: Compile, unit tests, game tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (compile, unit tests, reobfuscated jar)
        run: ./gradlew build --stacktrace --no-daemon

      - name: Game tests (headless server with AE2)
        run: ./gradlew runGameTestServer --stacktrace --no-daemon

      - name: Check the jar
        run: |
          ls -la build/libs
          JAR=build/libs/ae2declogger-forge-${MC_VERSION}-$(grep '^mod_version=' gradle.properties | cut -d= -f2).jar
          test -f "$JAR"
          echo "JAR=$JAR" >> "$GITHUB_ENV"
          unzip -l "$JAR"
          echo "--- mods.toml"
          unzip -p "$JAR" META-INF/mods.toml
          if unzip -l "$JAR" | grep -q 'gametest/'; then echo "::error::test classes leaked into the release jar"; exit 1; fi
          if unzip -l "$JAR" | grep -q 'structures/'; then echo "::error::test structures leaked into the release jar"; exit 1; fi
          echo "--- reobfuscation check (expect SRG names like m_xxxx_ in the item class)"
          mkdir -p /tmp/jarcheck && (cd /tmp/jarcheck && unzip -o -q "$GITHUB_WORKSPACE/$JAR")
          javap -p /tmp/jarcheck/com/syhros/ae2declogger/item/DecloggerItem.class | tee /tmp/javap.txt
          grep -q 'm_[0-9]*_' /tmp/javap.txt || { echo "::error::jar does not look reobfuscated"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ae2declogger-jar
          path: |
            build/libs/*.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gametest-logs
          path: |
            run/gametest/logs/
            build/reports/tests/
          if-no-files-found: ignore

  smoke:
    name: Server smoke test (${{ matrix.pack }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pack: [ae2-only, ae2-gtceu]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/download-artifact@v4
        with:
          name: ae2declogger-jar
          path: jars

      - name: Install Forge server and mods
        run: |
          mkdir -p server/mods
          cd server
          curl -fsSL -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/${MC_VERSION}-${FORGE_VERSION}/forge-${MC_VERSION}-${FORGE_VERSION}-installer.jar"
          java -jar installer.jar --installServer > install.log 2>&1 || { tail -50 install.log; exit 1; }
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\nmax-tick-time=-1\n' > server.properties
          echo "-Xmx3G" > user_jvm_args.txt
          curl -fsSL -o mods/ae2.jar "https://modmaven.dev/appeng/appliedenergistics2-forge/${AE2_VERSION}/appliedenergistics2-forge-${AE2_VERSION}.jar"
          curl -fsSL -o mods/guideme.jar "https://repo1.maven.org/maven2/org/appliedenergistics/guideme/${GUIDEME_VERSION}/guideme-${GUIDEME_VERSION}.jar"
          if [ "${{ matrix.pack }}" = "ae2-gtceu" ]; then
            curl -fsSL -o mods/gtceu.jar "https://maven.gtceu.com/com/gregtechceu/gtceu/gtceu-${MC_VERSION}/${GTCEU_VERSION}/gtceu-${MC_VERSION}-${GTCEU_VERSION}.jar"
          fi
          cp $(ls ../jars/*.jar | grep -v -- '-dev.jar' | grep -v -- '-sources.jar') mods/
          ls -la mods

      - name: Start, check, stop
        run: |
          if [ "${{ matrix.pack }}" = "ae2-gtceu" ]; then GT="GregTech integration: on"; else GT="GregTech integration: off"; fi
          python3 .github/scripts/server_smoke.py server 900 "AE2 Declogger ready" "$GT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs-${{ matrix.pack }}
          path: |
            server/logs/
            server/crash-reports/
          if-no-files-found: ignore

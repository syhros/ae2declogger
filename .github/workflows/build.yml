name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release (creates tag v<mod_version> on this commit)
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Gradle runs on Java 17; each Minecraft version compiles with its own Java (toolchains found through these).
  GRADLE_ARGS: --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64

jobs:
  plan:
    name: Versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.m.outputs.versions }}
      smoke: ${{ steps.m.outputs.smoke }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: python3 .github/scripts/versions_matrix.py

  unit:
    name: Unit tests (Minecraft-free logic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :logic-tests:test $GRADLE_ARGS

  legacy:
    # 1.16.5, 1.12.2 and GTNH 1.7.10 are separate Gradle builds under legacy/ (ForgeGradle 6, RetroFuturaGradle and
    # GTNH's convention plugin don't mix with the root build). See legacy/gradle/shared.gradle.
    name: Build (${{ matrix.l.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        l:
          - { name: forge-1.16.5, label: forge-1.16.5, mc: 1.16.5, setup: '', args: '' }
          - { name: forge-1.12.2, label: forge-1.12.2, mc: 1.12.2, setup: '', args: '' }
          - { name: gtnh-1.7.10, label: gtnh-1.7.10, mc: 1.7.10, setup: setupCIWorkspace, args: '' }
          # The same jar with GregTech 5 in the dev server: the machine reader's names are checked against it.
          - { name: gtnh-1.7.10, label: gtnh-1.7.10-gregtech, mc: 1.7.10, setup: setupCIWorkspace, args: -PdevGregTech=true }
    defaults:
      run:
        working-directory: legacy/${{ matrix.l.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            21
            25
            17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          set -o pipefail
          if [ -n "${{ matrix.l.setup }}" ]; then ./gradlew --no-daemon ${{ matrix.l.args }} ${{ matrix.l.setup }}; fi
          ./gradlew --no-daemon ${{ matrix.l.args }} build 2>&1 | tee build.log || {
            echo "===== compiler errors ====="
            grep -E "error:|FAILED|What went wrong|Could not|Exception" -A 3 build.log | grep -v "^\s*at " | head -400
            exit 1
          }

      - name: Server self-test (development server with AE2)
        run: |
          mkdir -p run run/server
          echo "eula=true" > run/eula.txt
          echo "eula=true" > run/server/eula.txt
          timeout 1500 ./gradlew --no-daemon ${{ matrix.l.args }} runServer -PselfTest 2>&1 | tee selftest.log || true
          grep -E "AE2 DECLOGGER SERVER SELFTEST" selftest.log || { grep -E "Exception|ERROR|FATAL" selftest.log | head -60; exit 1; }
          grep -q "AE2 DECLOGGER SERVER SELFTEST PASS" selftest.log

      - name: Check the jar
        run: |
          ls -la build/libs
          JAR=$(ls build/libs/*.jar | grep -vE -- '-(dev|sources|api)\.jar$' | head -1)
          test -n "$JAR"
          echo "JAR=legacy/${{ matrix.l.name }}/$JAR" >> "$GITHUB_ENV"
          unzip -l "$JAR"
          unzip -l "$JAR" | grep -q 'com/syhros/ae2declogger/logic/Thresholds.class'
          unzip -l "$JAR" | grep -q 'com/syhros/ae2declogger/Ae2Declogger.class'
          # Java 8 bytecode (major version 52) for every class
          mkdir -p /tmp/jarcheck && (cd /tmp/jarcheck && unzip -o -q "$GITHUB_WORKSPACE/legacy/${{ matrix.l.name }}/$JAR")
          BAD=$(find /tmp/jarcheck -name '*.class' -exec sh -c 'v=$(od -An -j6 -N2 -tu1 "$1" | awk "{print \$1*256+\$2}"); [ "$v" -gt 52 ] && echo "$1"' _ {} \; | head)
          if [ -n "$BAD" ]; then echo "::error::classes newer than Java 8: $BAD"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.l.label }}
          path: ${{ env.JAR }}
          if-no-files-found: error

  legacy-client:
    # The legacy dev clients draw the monitor (each tab) and the machine viewer with made-up data, save screenshots
    # and quit (selftest/ClientSelfTest). Screenshots are uploaded as an artifact.
    name: Client self-test (${{ matrix.l.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        l:
          - { name: forge-1.16.5, setup: '' }
          - { name: forge-1.12.2, setup: '' }
          - { name: gtnh-1.7.10, setup: setupCIWorkspace }
    defaults:
      run:
        working-directory: legacy/${{ matrix.l.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: |
            8
            21
            25
            17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install a virtual display
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb mesa-utils x11-xserver-utils

      - name: Run the client self-test
        run: |
          if [ -n "${{ matrix.l.setup }}" ]; then ./gradlew --no-daemon ${{ matrix.l.setup }}; fi
          timeout 1800 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew --no-daemon runClient -PclientSelfTest 2>&1 | tee client.log || true
          grep -E "AE2 DECLOGGER CLIENT SELFTEST" client.log || { grep -E "Exception|ERROR|FATAL" client.log | head -80; exit 1; }
          grep -q "AE2 DECLOGGER CLIENT SELFTEST PASS" client.log
          find . -name 'declogger-*.png' | head -20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-screenshots-${{ matrix.l.name }}
          path: |
            legacy/${{ matrix.l.name }}/**/screenshots/declogger-*.png
            legacy/${{ matrix.l.name }}/client.log
          if-no-files-found: ignore

  build:
    name: Build and game tests (${{ matrix.v.name }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        v: ${{ fromJSON(needs.plan.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.v.java }}
            17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build (compile, release jar)
        run: |
          set -o pipefail
          ./gradlew :${{ matrix.v.name }}:build $GRADLE_ARGS 2>&1 | tee build.log || {
            echo "===== compiler errors ====="
            grep -E "error:|warning: \[|FAILED|What went wrong|Could not|Exception" -A 3 build.log | grep -v "^\s*at " | head -400
            exit 1
          }

      - name: Game tests (headless server with AE2)
        run: |
          set -o pipefail
          ./gradlew :${{ matrix.v.name }}:runGameTestServer $GRADLE_ARGS 2>&1 | tee gametest.log || {
            echo "===== game test failures ====="
            grep -E "GameTest|gametest|failed|FAILED|Exception|Error|error" gametest.log | grep -v "^\s*at " | tail -200
            exit 1
          }
          grep -E "All [0-9]+ required tests passed" gametest.log

      - name: Server self-test (development server)
        run: |
          ./gradlew :${{ matrix.v.name }}:runSelfTestServer $GRADLE_ARGS 2>&1 | tee selftest-server.log || true
          grep -E "AE2 DECLOGGER SERVER SELFTEST" selftest-server.log
          grep -q "AE2 DECLOGGER SERVER SELFTEST PASS" selftest-server.log

      - name: Check the jar
        run: |
          D=versions/${{ matrix.v.name }}/build/libs
          ls -la $D
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          JAR=$D/ae2declogger-${{ matrix.v.loader }}-${{ matrix.v.mc }}-${VERSION}.jar
          test -f "$JAR"
          echo "JAR=$JAR" >> "$GITHUB_ENV"
          unzip -l "$JAR"
          if unzip -l "$JAR" | grep -q 'gametest/'; then echo "::error::test classes leaked into the release jar"; exit 1; fi
          if unzip -l "$JAR" | grep -qE 'structures?/'; then echo "::error::test structures leaked into the release jar"; exit 1; fi
          if [ "${{ matrix.v.loader }}" = "forge" ]; then
            unzip -p "$JAR" META-INF/mods.toml
            mkdir -p /tmp/jarcheck && (cd /tmp/jarcheck && unzip -o -q "$GITHUB_WORKSPACE/$JAR")
            javap -p /tmp/jarcheck/com/syhros/ae2declogger/client/screen/DecloggerScreen.class > /tmp/javap.txt
            grep -q 'm_[0-9]*_' /tmp/javap.txt || { echo "::error::jar does not look reobfuscated"; exit 1; }
          else
            unzip -p "$JAR" META-INF/neoforge.mods.toml
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.v.name }}
          path: ${{ env.JAR }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: gametest-jar-${{ matrix.v.name }}
          path: versions/${{ matrix.v.name }}/build/libs/*-gametest.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.v.name }}
          path: |
            *.log
            versions/${{ matrix.v.name }}/run/gametest/logs/
            versions/${{ matrix.v.name }}/run/selftest-server/logs/
          if-no-files-found: ignore

  client-selftest:
    name: Client self-test (${{ matrix.v.name }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        v: ${{ fromJSON(needs.plan.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.v.java }}
            17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install a virtual display
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libgl1-mesa-dri mesa-utils

      - name: Run the client self-test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :${{ matrix.v.name }}:runSelfTestClient $GRADLE_ARGS --stacktrace || echo "client exited with $?"
          R=versions/${{ matrix.v.name }}/run/selftest
          echo "--- result"
          cat $R/selftest-result.txt
          head -1 $R/selftest-result.txt | grep -qx PASS

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.v.name }}
          path: |
            versions/${{ matrix.v.name }}/run/selftest/screenshots/
            versions/${{ matrix.v.name }}/run/selftest/selftest-result.txt
            versions/${{ matrix.v.name }}/run/selftest/logs/
            versions/${{ matrix.v.name }}/run/selftest/crash-reports/
          if-no-files-found: ignore

  screenshots:
    name: Publish screenshots
    needs: client-selftest
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: screenshots-*
          path: shots
      - name: Push to the ci-screenshots branch (one folder per version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/out
          for d in shots/screenshots-*; do
            v=${d#shots/screenshots-}
            mkdir -p /tmp/out/$v
            find $d -name '*.png' -exec cp {} /tmp/out/$v/ \;
            find $d -name 'selftest-result.txt' -exec cp {} /tmp/out/$v/ \;
          done
          cd /tmp/out
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Self-test screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

  smoke:
    # A real dedicated server per version, with AE2 alone, with popular AE2 add-ons, with the tech mods the Declogger
    # reads machine status from, and with GregTech where it is built. The test jar runs the server self-test
    # (gametest/ServerSelfTest) next to spawn: a two-step job, a stall, the machine viewer and the history. On the tech
    # server, gametest/ModMachineSelfTest also checks every machine status integration against the installed mods.
    name: Server (${{ matrix.s.name }}, ${{ matrix.s.pack }})
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        s: ${{ fromJSON(needs.plan.outputs.smoke) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.s.java }}

      - uses: actions/download-artifact@v4
        with:
          name: gametest-jar-${{ matrix.s.name }}
          path: jars

      - name: Install the server and mods
        run: |
          mkdir -p server/mods
          cd server
          if [ "${{ matrix.s.loader }}" = "forge" ]; then
            URL="https://maven.minecraftforge.net/net/minecraftforge/forge/${{ matrix.s.mc }}-${{ matrix.s.loaderVersion }}/forge-${{ matrix.s.mc }}-${{ matrix.s.loaderVersion }}-installer.jar"
          else
            URL="https://maven.neoforged.net/releases/net/neoforged/neoforge/${{ matrix.s.loaderVersion }}/neoforge-${{ matrix.s.loaderVersion }}-installer.jar"
          fi
          curl -fsSL --retry 4 --retry-all-errors -o installer.jar "$URL"
          java -jar installer.jar --installServer > install.log 2>&1 || { tail -50 install.log; exit 1; }
          echo "eula=true" > eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\nmax-tick-time=-1\npause-when-empty-seconds=0\n' > server.properties
          echo "-Xmx3G" > user_jvm_args.txt
          echo "-Dae2declogger.serverSelfTest=true" >> user_jvm_args.txt
          if [ "${{ matrix.s.pack }}" = "gtceu" ]; then echo "-Dae2declogger.gtSelfTest=true" >> user_jvm_args.txt; fi
          if [ "${{ matrix.s.pack }}" = "tech" ]; then echo "-Dae2declogger.modSelfTest=true" >> user_jvm_args.txt; fi
          python3 ../.github/scripts/fetch_mods.py "${{ matrix.s.mc }}" "${{ matrix.s.loader }}" "${{ matrix.s.pack }}" mods
          cp ../jars/*-gametest.jar mods/
          ls -la mods

      - name: Start, self-test, stop
        run: |
          if [ "${{ matrix.s.pack }}" = "gtceu" ]; then
            export WAIT_FOR="AE2 DECLOGGER SERVER SELFTEST (PASS|FAIL) && AE2 DECLOGGER GT SELFTEST (PASS|FAIL)"
            python3 .github/scripts/server_smoke.py server 900 "AE2 Declogger ready" "GregTech integration: on" \
              "AE2 DECLOGGER SERVER SELFTEST PASS" "AE2 DECLOGGER GT SELFTEST PASS"
          elif [ "${{ matrix.s.pack }}" = "tech" ]; then
            export WAIT_FOR="AE2 DECLOGGER SERVER SELFTEST (PASS|FAIL) && AE2 DECLOGGER MOD SELFTEST (PASS|FAIL)"
            python3 .github/scripts/server_smoke.py server 900 "AE2 Declogger ready" \
              "AE2 DECLOGGER SERVER SELFTEST PASS" "AE2 DECLOGGER MOD SELFTEST PASS"
          else
            export WAIT_FOR="AE2 DECLOGGER SERVER SELFTEST (PASS|FAIL)"
            python3 .github/scripts/server_smoke.py server 900 "AE2 Declogger ready" "GregTech integration: off" \
              "AE2 DECLOGGER SERVER SELFTEST PASS"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-logs-${{ matrix.s.name }}-${{ matrix.s.pack }}
          path: |
            server/logs/
            server/crash-reports/
          if-no-files-found: ignore

  advanced-ae:
    # The Declogger reads Advanced AE's quantum computer CPUs and advanced pattern providers by reflection (class,
    # field and method names). This checks that every name it relies on exists in real releases for each version.
    name: Advanced AE names (${{ matrix.aae.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        aae:
          - { label: '1.20.1 AAE 1.1.0', github: '1.1.0-1.20.1-forge' }
          - { label: '1.20.1 AAE 1.2.0', github: '1.2.0-1.20.1-forge' }
          - { label: '1.20.1 AAE 1.3.6', github: '1.3.6-1.20.1-forge' }
          - { label: '1.21.1 newest', mc: '1.21.1', loader: 'neoforge' }
          - { label: '26.1.2 newest', mc: '26.1.2', loader: 'neoforge' }
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Download the Advanced AE release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p aae
          if [ -n "${{ matrix.aae.github }}" ]; then
            for i in 1 2 3 4; do
              gh release download "${{ matrix.aae.github }}" -R pedroksl/AdvancedAE -p '*.jar' -D aae --clobber && break
              sleep $((i * 5))
            done
          else
            URL=$(curl -fsSL "https://api.modrinth.com/v2/project/advancedae/version?game_versions=%5B%22${{ matrix.aae.mc }}%22%5D&loaders=%5B%22${{ matrix.aae.loader }}%22%5D" \
              | python3 -c "import json,sys; v=json.load(sys.stdin)[0]; print([f['url'] for f in v['files'] if f['primary']][0])")
            curl -fsSL -o aae/aae.jar "$URL"
          fi
          ls -la aae

      - name: Check the names the Declogger reads
        run: |
          JAR=$(ls aae/*.jar | grep -v -e '-sources' -e '-api' -e '-dev' | head -1)
          echo "Checking $JAR"
          mkdir x && (cd x && unzip -q "../$JAR")
          P=x/net/pedroksl/advanced_ae
          fail=0
          check() {
            if javap -p "$1" 2>/dev/null | grep -qE "$2"; then echo "ok   $3"; else echo "::error::$3 (not found in $1)"; javap -p "$1" || true; fail=1; fi
          }
          check $P/common/cluster/AdvCraftingCPU.class 'implements .*appeng\.api\.networking\.crafting\.ICraftingCPU' "AdvCraftingCPU is an AE2 crafting CPU"
          check $P/common/cluster/AdvCraftingCPU.class 'AdvCraftingCPULogic craftingLogic;' "AdvCraftingCPU.craftingLogic"
          check $P/common/cluster/AdvCraftingCPU.class 'AdvCraftingCPUCluster cluster;' "AdvCraftingCPU.cluster (CPU numbering)"
          check $P/common/cluster/AdvCraftingCPU.class 'public boolean isActive\(\);' "AdvCraftingCPU.isActive()"
          L=$P/common/logic/AdvCraftingCPULogic.class
          check $L 'public boolean hasJob\(\);' "logic.hasJob()"
          check $L 'public void getAllItems\(appeng\.api\.stacks\.KeyCounter\);' "logic.getAllItems(KeyCounter)"
          check $L 'public long getStored\(appeng\.api\.stacks\.AEKey\);' "logic.getStored(AEKey)"
          check $L 'public long getWaitingFor\(appeng\.api\.stacks\.AEKey\);' "logic.getWaitingFor(AEKey)"
          check $L 'public long getPendingOutputs\(appeng\.api\.stacks\.AEKey\);' "logic.getPendingOutputs(AEKey)"
          check $L 'public appeng\.api\.networking\.crafting\.ICraftingLink getLastLink\(\);' "logic.getLastLink()"
          check $L 'public long getLastModifiedOnTick\(\);' "logic.getLastModifiedOnTick()"
          check $L 'getElapsedTimeTracker\(\);' "logic.getElapsedTimeTracker()"
          check $L ' job;' "logic.job"
          check $P/common/logic/ElapsedTimeTracker.class 'public float getProgress\(\);' "ElapsedTimeTracker.getProgress()"
          check $P/common/logic/ExecutingCraftingJob.class ' tasks;' "ExecutingCraftingJob.tasks"
          check "$P/common/logic/ExecutingCraftingJob\$TaskProgress.class" 'long value;' "TaskProgress.value"
          check $P/mixins/cpu/MixinCraftingCPUMenu.class 'AdvCraftingCPU [A-Za-z_$]+;' "crafting screen menu keeps the quantum CPU in a field"
          # Advanced pattern providers are read by method name (server/ProviderIndex): getTargets() and getLogic()
          # on the host, isBlocking() and getCraftingLockedReason() on the logic.
          if [ -f $P/common/logic/AdvPatternProviderLogicHost.class ]; then
            check $P/common/logic/AdvPatternProviderLogicHost.class 'getTargets\(\);' "advanced pattern provider host getTargets()"
            check $P/common/logic/AdvPatternProviderLogicHost.class 'getLogic\(\);' "advanced pattern provider host getLogic()"
            check $P/common/logic/AdvPatternProviderLogic.class 'public boolean isBlocking\(\);' "advanced pattern provider isBlocking()"
            check $P/common/logic/AdvPatternProviderLogic.class 'getCraftingLockedReason\(\);' "advanced pattern provider getCraftingLockedReason()"
          fi
          exit $fail

  release:
    name: Publish release
    # Runs for a pushed v* tag, or from Actions > Run workflow with "release" ticked.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [unit, build, smoke, client-selftest, advanced-ae]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: jars
          merge-multiple: true

      - name: Create the GitHub release with every version's jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          TAG="v${VERSION}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${TAG}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match mod_version ${VERSION} in gradle.properties"
            exit 1
          fi
          ls -la jars
          python3 .github/scripts/release_notes.py "$VERSION" jars > notes.md
          cat notes.md
          # Creates the tag on this commit when it does not exist yet (manual runs).
          gh release create "${TAG}" jars/*.jar --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "AE2 Declogger ${VERSION}" --notes-file notes.md

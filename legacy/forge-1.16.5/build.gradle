// AE2 Declogger for Minecraft 1.16.5 (Forge 36, AE2 8). ForgeGradle 6 with Mojang's official mappings, Java 8.
// Shared sources and the preprocessor: ../gradle/shared.gradle.
plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

ext.legacyMc = minecraft_version
apply from: '../gradle/shared.gradle'

version = modVersion
group = 'com.syhros.ae2declogger'
base { archivesName = "ae2declogger-forge-${minecraft_version}" }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(8)
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            // AE2's mixins name methods by SRG; remap them to the official names of the dev environment.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { ae2declogger { source sourceSets.main } }
        }
        client {
            // -PclientSelfTest: the dev client draws every screen with made-up data, saves screenshots and quits.
            if (project.hasProperty('clientSelfTest')) {
                property 'ae2declogger.clientSelfTest', 'true'
            }
        }
        server {
            args '--nogui'
            // -PselfTest: the dev server runs the self-test (selftest/ServerSelfTest) and stops when it is done.
            if (project.hasProperty('selfTest')) {
                property 'ae2declogger.serverSelfTest', 'true'
                property 'ae2declogger.selfTestExit', 'true'
            }
        }
    }
}

repositories {
    maven {
        name = 'ModMaven (AE2)'
        url = 'https://modmaven.dev/'
        content { includeGroup 'appeng' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // Compiled against AE2 itself: the crafting CPU and interface internals are read by reflection, but the public
    // API (grids, stacks, crafting) is used directly.
    implementation fg.deobf("appeng:appliedenergistics2:${ae2_version}")
}

processResources {
    def props = [mod_version: project.version, minecraft_version: minecraft_version]
    inputs.properties props
    filesMatching('META-INF/mods.toml') { expand props }
}

jar {
    manifest.attributes(
            'Specification-Title': 'ae2declogger',
            'Specification-Vendor': 'syhros',
            'Implementation-Title': 'AE2 Declogger',
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'syhros')
    finalizedBy 'reobfJar'
}
